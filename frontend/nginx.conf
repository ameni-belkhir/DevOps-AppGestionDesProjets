server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /entreprise/ {
        proxy_pass http://spring-service:8080;
    }

    location /equipe/ {
        proxy_pass http://spring-service:8080;
    }

    location /projet/ {
        proxy_pass http://spring-service:8080;
    }

    location /projet-detaille/ {
        proxy_pass http://spring-service:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
